<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Villaggio Jarvis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: plastico 3D a tutto schermo, barra in alto, dock agenti in basso, report a destra (desktop) o dal basso (telefono) */
:root{
  --bg:#101a19; --panel:#162321; --panel-2:#1d2d2b; --line:#2d4340;
  --fg:#ece6d7; --muted:#a3b3ad; --brass:#d4a94c;
  --ok:#74c27a; --warn:#e3a83e; --crit:#ea5b50; --idle:#8f9c97;
  --display:"Alegreya SC",Georgia,serif; --body:"Alegreya Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
h1{font-family:var(--display);font-weight:700;font-size:1.35rem;margin:0;letter-spacing:.02em;color:var(--brass)}
.prova{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 6px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button,.btn{font:500 .9rem var(--body);color:var(--fg);background:transparent;border:0;padding:6px 11px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--brass);color:#1b1407}
.btn{border:1px solid var(--line);border-radius:6px}
.btn-sire{border-color:var(--brass);color:#1b1407;background:var(--brass);font-weight:700}
.btn-sire:hover{background:#e2bb63}
.btn[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}
.btn:hover,.seg button:hover:not([aria-pressed="true"]){background:var(--panel-2)}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.stage{position:relative;min-height:0;overflow:hidden;background:#8fbfe0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;font:700 13px var(--body);color:#f3ecdc;background:rgba(22,20,16,.82);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:4px 11px 4px 8px;cursor:pointer;white-space:nowrap;transform:translate(-50%,-100%);will-change:transform}
.lbl[aria-pressed="true"]{border-color:var(--brass)}
.hint{position:absolute;top:10px;left:max(16px,env(safe-area-inset-left,0px));font-size:.8rem;color:#eef3ee;background:rgba(16,26,25,.6);padding:4px 8px;border-radius:4px;pointer-events:none}
.dock{position:absolute;left:0;right:0;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;overflow-x:auto;pointer-events:none}
.chip{pointer-events:auto;flex:none;display:flex;align-items:center;gap:8px;font:500 .9rem var(--body);color:var(--fg);background:rgba(22,35,33,.92);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 10px;cursor:pointer}
.chip small{color:var(--muted);font-size:.78rem}
.chip[aria-pressed="true"]{border-color:var(--brass)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.panel{position:absolute;top:0;right:0;bottom:0;width:380px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding-block:18px 28px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));z-index:4;display:flex;flex-direction:column;gap:18px}
@media (max-width:760px){
  .panel{top:auto;left:0;width:auto;max-height:58%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
  .hint{display:none}
  h1{font-size:1.15rem}
}
.panel>*{flex-shrink:0}
.ph{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
.eyebrow{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ph h2{font-family:var(--display);font-size:1.7rem;margin:0;line-height:1.1;text-wrap:balance}
.ph p{margin:0;color:var(--muted);grid-column:1/-1}
.close{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:6px;width:34px;height:34px;font-size:1.1rem;cursor:pointer;grid-row:1/3;grid-column:2}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid currentColor;width:max-content;grid-column:1/-1}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--panel-2);padding:10px 12px;min-width:0}
.kpi b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums;font-weight:700}
.kpi span{font-size:.8rem;color:var(--muted)}
h3{font-family:var(--display);font-size:1.05rem;margin:0 0 8px;color:var(--brass);font-weight:500;letter-spacing:.03em}
.need{border:1px solid var(--crit);border-radius:8px;padding:12px;background:rgba(234,91,80,.08)}
.need h3{color:var(--crit)}
.need ol{margin:0;padding-left:20px;display:grid;gap:8px}
.need li span{display:block;color:var(--muted);font-size:.88rem}
.log{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.log li{display:grid;grid-template-columns:52px 1fr;gap:8px}
.log time{font-family:var(--mono);font-size:.78rem;color:var(--muted);padding-top:2px}
.bar{height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--warn)}
.agents{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.agents button{width:100%;display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--fg);font:500 .95rem var(--body);cursor:pointer;text-align:left}
.agents button small{margin-left:auto;color:var(--muted)}
details summary{cursor:pointer;color:var(--muted);font-size:.88rem}
pre{font-family:var(--mono);font-size:.74rem;line-height:1.5;background:#0c1413;border:1px solid var(--line);border-radius:6px;padding:10px;overflow-x:auto;margin:8px 0 0;color:#cfe0da}
.foot{font-size:.78rem;color:var(--muted);margin-top:auto}
.loading{position:absolute;inset:0;display:grid;place-content:center;gap:6px;text-align:center;background:linear-gradient(#7fb3d9,#cfe3ee);color:#1b2a33;z-index:6;font-family:var(--display);font-size:1.3rem}
.loading span{font-family:var(--body);font-size:.95rem}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--fg);background:var(--bg)}
</style>

<div class="app">
  <header>
    <div class="brand"><h1>Villaggio Jarvis</h1><span class="prova">Dati [PROVA]</span></div>
    <div class="seg" role="group" aria-label="Stagione" id="skins"></div>
    <button class="btn btn-sire" id="sire" type="button">Uh SIRE!</button>
    <button class="btn" id="notte" type="button" aria-pressed="false">Notte</button>
    <button class="btn" id="fit" type="button">Panoramica</button>
  </header>
  <div class="stage" id="stage">
    <div class="labels" id="labels"></div>
    <div class="hint">Trascina per muoverti · due dita per zoom e rotazione · tocca un villaggio</div>
    <div class="loading" id="loading"><b>Costruisco il regno…</b><span id="loadpct">0%</span></div>
    <nav class="dock" id="dock" aria-label="Agenti"></nav>
    <aside class="panel" id="panel" hidden aria-live="polite"></aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script>
(()=>{
const stage=document.getElementById('stage'),loadingEl=document.getElementById('loading'),pctEl=document.getElementById('loadpct');
const fail=msg=>{loadingEl.innerHTML=`<b>${msg}</b><span>Ricarica la pagina per riprovare.</span>`};
if(!window.THREE||!THREE.OrbitControls||!THREE.GLTFLoader||!THREE.SkeletonUtils){fail('Impossibile caricare la grafica 3D');return}
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const isMobile=()=>stage.clientWidth<=760;
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lin=h=>new THREE.Color(h).convertSRGBToLinear();

/* ---------- dati ---------- */
const STATI={lavora:{label:'Al lavoro',c:'#74c27a'},bloccato:{label:'Serve te',c:'#ea5b50'},cantiere:{label:'In costruzione',c:'#e3a83e'},riposo:{label:'A riposo',c:'#8f9c97'}};
const AGENTI=[
 {id:'cervello',nome:'Sire',tipo:'Castello d\'oro',ruolo:'Memoria condivisa e regole di Jarvis',stato:'lavora',gx:21,gy:21,castello:true,
  report:{aggiornato:'21:30',fonte:'jarvis-brain/reports/cervello.json',kpi:[['Regole in memoria','48'],['Agenti attivi','2 di 4'],['Servono da te','2'],['Ultima lezione','19:02']],
   attivita:[['19:02','Nuova regola: i preventivi video partono sempre da 3 opzioni'],['15:40','Unite due regole doppie sui follow-up'],['09:10','Backup della memoria completato']],blocchi:[]}},
 {id:'preventivi',nome:'Preventivi',tipo:'Agente',ruolo:'Prepara e segue i preventivi',stato:'lavora',gx:9,gy:11,
  report:{aggiornato:'21:12',fonte:'jarvis-brain/reports/preventivi.json',kpi:[['Inviati a ottobre','7'],['In attesa di risposta','3'],['Valore in trattativa','€ 18.400'],['Tasso di chiusura','42%']],
   attivita:[['21:12','Bozza pronta: video hero + sito one-page per un hotel'],['19:40','Follow-up inviato a un ristorante dopo 5 giorni'],['16:05','Listino aggiornato con il pacchetto social']],blocchi:[]}},
 {id:'outreach',nome:'Outreach',tipo:'Agente',ruolo:'Trova e contatta nuovi clienti',stato:'bloccato',gx:33,gy:9,
  report:{aggiornato:'20:48',fonte:'jarvis-brain/reports/outreach.json',kpi:[['Contatti in coda','24'],['Mail della settimana','18'],['Risposte','4'],['Appuntamenti','1']],
   attivita:[['20:48','In pausa: nuovo modello di mail per hotel da approvare'],['18:30','Trovate 12 strutture ricettive tra Rimini e Riccione'],['11:15','Un agriturismo ha risposto e chiede un incontro']],
   blocchi:[{cosa:'Approva il nuovo modello di mail per gli hotel',come:'Rispondi APPROVA o MODIFICA al messaggio su Telegram'}]}},
 {id:'fatture',nome:'Fatture',tipo:'Agente',ruolo:'Scadenze, incassi e solleciti',stato:'cantiere',avanzamento:35,gx:31,gy:31,
  report:{aggiornato:'—',fonte:'jarvis-brain/reports/fatture.json',kpi:[['Costruzione','35%'],['Fase attuale','Lettura fatture']],
   attivita:[['22/10','Definito il formato del report'],['21/10','Importato un elenco di scadenze di prova']],
   blocchi:[{cosa:'Accesso in sola lettura alla casella delle fatture',come:'Collega Gmail limitato all\'etichetta Fatture'}]}},
 {id:'contatti',nome:'Contatti',tipo:'Agente',ruolo:'Rubrica clienti e cose da ricordare',stato:'riposo',gx:11,gy:31,
  report:{aggiornato:'08:00',fonte:'jarvis-brain/reports/contatti.json',kpi:[['Contatti totali','312'],['Nuovi in settimana','9'],['Da ricontattare','14'],['Prossimo giro','domani 08:00']],
   attivita:[['08:00','Giro del mattino: uniti 3 contatti doppi'],['ieri','Aggiunto un contatto da una mail di richiesta']],blocchi:[]}}
];
const byId=Object.fromEntries(AGENTI.map(a=>[a.id,a]));

/* ---------- stagioni ---------- */
const SEASONS={
 estate:{nome:'Estate',ground:[0x78a843,0x82b24b,0x6d9c3c,0x8dba55],road:0xc2a271,plaza:0xc7ab7c,shore:0xcdb886,water:0x3d9cc4,foliage:0xffffff,
   sky:['#4f97d6','#bfe0f2','#e8f3f7'],sun:0xfff0d8,part:null},
 autunno:{nome:'Autunno',ground:[0x9a9a45,0xa8a04a,0x8c8a3e,0xb3a352],road:0xb8956a,plaza:0xc0a27a,shore:0xc9b17f,water:0x3a86a8,foliage:0xffa65a,
   sky:['#5d86b8','#f0cf9e','#f5e2c4'],sun:0xffd7a8,part:'foglie'},
 inverno:{nome:'Inverno',ground:[0xeef3f7,0xe4ebf1,0xf6f9fb,0xdde6ee],road:0xb9b4ad,plaza:0xc9c4bc,shore:0xd7dde3,water:0x6aa8c4,foliage:0xe6eef6,
   sky:['#7e9cba','#d6e2ec','#eef3f7'],sun:0xf2f6ff,part:'neve'}
};
let season='estate';try{const s=localStorage.getItem('regno-stagione');if(SEASONS[s])season=s}catch(e){}
let night=false;

/* ---------- geografia ---------- */
const N=42,T2=2;
const tile=new Uint8Array(N*N),shade=new Uint8Array(N*N);
{const r=rng(7);for(let k=0;k<N*N;k++)shade[k]=Math.floor(r()*4)}
for(let j=0;j<N;j++)for(let i=0;i<N;i++){const d=Math.hypot((i+.5-3.5)/4.2,(j+.5-20.5)/5.2)+Math.sin(i*1.7+j)*.06;if(d<1)tile[i+j*N]=3;else if(d<1.3)tile[i+j*N]=4}
const C=byId.cervello;
for(const a of AGENTI){const R=a.castello?4:1;
  for(let j=-R;j<=R;j++)for(let i=-R;i<=R;i++)if(Math.abs(i)+Math.abs(j)<=R+(a.castello?1:1))tile[(a.gx+i)+(a.gy+j)*N]=1;
  if(a.castello)continue;let x=C.gx,y=C.gy;
  while(x!==a.gx){x+=Math.sign(a.gx-x);if(tile[x+y*N]!==1)tile[x+y*N]=2}
  while(y!==a.gy){y+=Math.sign(a.gy-y);if(tile[x+y*N]!==1)tile[x+y*N]=2}}
const tw=(i,j)=>[i*T2-N+1,j*T2-N+1];
const tileAt=(x,z)=>{const i=Math.floor((x+N)/T2),j=Math.floor((z+N)/T2);return i<0||j<0||i>=N||j>=N?-1:tile[i+j*N]};
const Rf=th=>48+3.5*Math.sin(3*th+1)+2.2*Math.sin(7*th+2)+1.3*Math.sin(13*th);
const RIVER_X=-32.5;
const isRiver=(x,z)=>Math.abs(x-RIVER_X)<1.25+Math.sin(z*.7)*.15&&z>8.5;
const water=(x,z)=>tileAt(x,z)===3||isRiver(x,z);
const shoreAt=(x,z)=>tileAt(x,z)===4||(Math.abs(x-RIVER_X)<2.1&&z>4)||[[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>water(x+a*1.3,z+b*1.3));
const SPOTS=[{x:-6,z:-38,r:7},{x:9,z:-38.5,r:7},{x:-38,z:-22,r:6},{x:41,z:-2,r:6},{x:34,z:34,r:5},{x:-30,z:37,r:5}];
const villDist=(x,z)=>Math.min(...AGENTI.map(a=>{const[cx,cz]=tw(a.gx,a.gy);return Math.hypot(x-cx,z-cz)-(a.castello?5:0)}));
function height(x,z){
  if(water(x,z))return -.8;
  const r=Math.hypot(x,z),edge=Rf(Math.atan2(z,x))-r;
  if(shoreAt(x,z))return -.1;
  const t=tileAt(x,z);if(t===1||t===2)return 0;
  let f=clamp((villDist(x,z)-5)/4,0,1)*clamp(edge/4,0,1);
  for(const[dx,dz]of[[1.3,0],[-1.3,0],[0,1.3],[0,-1.3]]){const q=tileAt(x+dx,z+dz);if(q===1||q===2)f=0}
  return f*Math.max(0,Math.sin(x*.32)*Math.cos(z*.27)*.9+Math.sin(x*.8+z*.6)*.25+.6);
}

/* ---------- three ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,isMobile()?1.75:2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
stage.prepend(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(34,1,1,1400);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.08;controls.screenSpacePanning=false;
controls.minDistance=12;controls.maxDistance=540;controls.maxPolarAngle=1.62;controls.minPolarAngle=.2;
controls.mouseButtons={LEFT:THREE.MOUSE.PAN,MIDDLE:THREE.MOUSE.DOLLY,RIGHT:THREE.MOUSE.ROTATE};
controls.touches={ONE:THREE.TOUCH.PAN,TWO:THREE.TOUCH.DOLLY_ROTATE};

const pmrem=new THREE.PMREMGenerator(renderer);let ENV=null;
{const es=new THREE.Scene(),g=new THREE.SphereGeometry(10,32,16),p=g.attributes.position,cols=[];
 for(let i=0;i<p.count;i++){const y=p.getY(i)/10,c=new THREE.Color();if(y>=0)c.setHSL(.57,.45,.45+.4*y);else c.setRGB(.32,.25,.17);cols.push(c.r,c.g,c.b)}
 g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));es.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide})));
 const sunb=new THREE.Mesh(new THREE.SphereGeometry(1.4,16,8),new THREE.MeshBasicMaterial({color:0xffffff}));sunb.position.set(-5,7,4);es.add(sunb);
 ENV=pmrem.fromScene(es,.03).texture}
const hemi=new THREE.HemisphereLight(0xdfefff,0x6b5a45,.8);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d8,2.1);sun.position.set(-52,90,40);sun.castShadow=true;
const sm=isMobile()?2048:4096;sun.shadow.mapSize.set(sm,sm);
Object.assign(sun.shadow.camera,{left:-56,right:56,top:56,bottom:-56,near:5,far:240});sun.shadow.bias=-.0005;sun.shadow.normalBias=.04;
scene.add(sun,sun.target);
const rim=new THREE.DirectionalLight(0x9fc4ff,.45);rim.position.set(40,-10,-30);scene.add(rim);

/* ---------- texture ---------- */
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t}
const softTex=canvasTex(64,64,g=>{const gr=g.createRadialGradient(32,32,1,32,32,31);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.4,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64)});
const flameTex=canvasTex(64,64,g=>{const gr=g.createRadialGradient(32,36,1,32,32,30);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.55,'rgba(255,255,255,.95)');gr.addColorStop(.8,'rgba(255,255,255,.4)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64)});
const streakTex=canvasTex(64,256,(g,w,h)=>{const r=rng(5);g.clearRect(0,0,w,h);for(let k=0;k<160;k++){const x=r()*w,y=r()*h,l=20+r()*90,a=.25+r()*.6;const gr=g.createLinearGradient(0,y,0,y+l);gr.addColorStop(0,`rgba(255,255,255,0)`);gr.addColorStop(.5,`rgba(255,255,255,${a})`);gr.addColorStop(1,`rgba(255,255,255,0)`);g.fillStyle=gr;g.fillRect(x,y,1.5+r()*3,l);g.fillRect(x,y-h,1.5+r()*3,l)}});

function waterfall(start,dir,width,opts={}){
  const pts=[],n=46,v0=opts.v0||1.6,up=opts.up||0,len=opts.len||62;
  for(let i=0;i<=n;i++){const s=i/n,tt=s*3.2;const out=v0*tt*(1-.15*s);const y=up*tt-(.5*9.8*.55*tt*tt);pts.push(new THREE.Vector3(start.x+dir.x*out,start.y+Math.max(y,-len)*(1)+0,start.z+dir.z*out))}

  for(let i=0;i<=n;i++){if(i)acc+=pts[i].distanceTo(pts[i-1]);const w=width*(1+i/n*.9);
    pos.push(pts[i].x+side.x*w/2,pts[i].y,pts[i].z+side.z*w/2,pts[i].x-side.x*w/2,pts[i].y,pts[i].z-side.z*w/2);uv.push(0,acc/len,1,acc/len)}
  for(let i=0;i<n;i++){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);
  const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,
    uniforms:{t:{value:0},map:{value:streakTex},col:{value:new THREE.Color(0xbfe8ff)},deep:{value:new THREE.Color(0x4aa7d6)},night:{value:0},len:{value:len/6}},
    vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader:`uniform float t;uniform sampler2D map;uniform vec3 col;uniform vec3 deep;uniform float night;uniform float len;varying vec2 vUv;
      void main(){float y=vUv.y;vec2 uv=vec2(vUv.x*1.3,y*len-t*1.6);float s=texture2D(map,uv).a;float s2=texture2D(map,uv*vec2(.7,.6)+vec2(.3,-t*.4)).a;
      float edge=smoothstep(0.,.18,vUv.x)*smoothstep(1.,.82,vUv.x);float fade=1.-smoothstep(.55,1.,y);float start=smoothstep(0.,.02,y)*.6+.4;

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const labelsEl=document.getElementById('labels');let sel=null;
function renderLabels(){labelsEl.innerHTML=AGENTI.map(a=>`<button class="lbl" type="button" data-id="${a.id}" aria-pressed="${a.id===sel}"><i class="dot" style="background:${STATI[a.stato].c}"></i>${esc(a.nome)}</button>`).join('')}
labelsEl.addEventListener('click',e=>{const b=e.target.closest('.lbl');if(b)select(b.dataset.id)});
const v3=new THREE.Vector3();
function placeLabels(){const W=stage.clientWidth,H=stage.clientHeight,items=[];
  labelsEl.querySelectorAll('.lbl').forEach(el=>{const a=byId[el.dataset.id];if(!a.anchor)return;v3.copy(a.anchor).project(camera);items.push({el,x:(v3.x*.5+.5)*W,y:(-v3.y*.5+.5)*H,w:el.offsetWidth||90,vis:v3.z<1})});
  items.sort((p,q)=>p.y-q.y);
  for(let i=0;i<items.length;i++)for(let j=0;j<i;j++){const a=items[i],b=items[j];if(Math.abs(a.x-b.x)<(a.w+b.w)/2+4&&a.y-b.y<28)a.y=b.y+28}
  for(const it of items){it.el.style.transform=`translate(${it.x}px,${it.y}px) translate(-50%,-100%)`;it.el.style.visibility=it.vis?'visible':'hidden'}}
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now()};focus.active=false});
renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;if(Math.hypot(e.clientX-down.x,e.clientY-down.y)<8&&performance.now()-down.t<500){const r=renderer.domElement.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera);const h=ray.intersectObjects(hits)[0];if(h)select(h.object.userData.id)}down=null});
controls.addEventListener('start',()=>{focus.active=false});

/* ---------- camera ---------- */
const focus={active:false,target:new THREE.Vector3(),pos:new THREE.Vector3()};
function fitDist(){const W=stage.clientWidth,H=stage.clientHeight,asp=W/Math.max(1,H),hf=2*Math.atan(Math.tan(THREE.MathUtils.degToRad(17))*asp);return clamp(56/Math.tan(hf/2),160,500)}
function flyTo(target,dist){const dir=camera.position.clone().sub(controls.target).normalize();if(dir.y<.45){dir.y=.6;dir.normalize()}focus.target.copy(target);focus.pos.copy(target).add(dir.multiplyScalar(dist));focus.active=!reduced;if(reduced){controls.target.copy(focus.target);camera.position.copy(focus.pos)}}
function fit(){const d=fitDist();focus.target.set(0,-12,0);focus.pos.set(d*.62,d*.5,d*.62);focus.active=!reduced;if(reduced){controls.target.copy(focus.target);camera.position.copy(focus.pos)}}
function applyView(){const W=stage.clientWidth,H=stage.clientHeight;renderer.setSize(W,H,false);
  if(sel&&!isMobile()){camera.aspect=(W+380)/H;camera.setViewOffset(W+380,H,380,0,W,H)}
  else if(sel&&isMobile()){const k=Math.round(H*.5);camera.aspect=W/(H+k);camera.setViewOffset(W,H+k,0,k,W,H)}
  else{camera.clearViewOffset();camera.aspect=W/H}
  camera.updateProjectionMatrix()}
new ResizeObserver(applyView).observe(stage);

/* ---------- loop ---------- */
let last=performance.now(),fpsN=0,fpsT=0,fpsDone=false;
function loop(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;const t=reduced?2:now/1000;
  if(world){
    if(focus.active){controls.target.lerp(focus.target,Math.min(1,dt*3));camera.position.lerp(focus.pos,Math.min(1,dt*3));if(camera.position.distanceTo(focus.pos)<.05)focus.active=false}
    controls.target.x=clamp(controls.target.x,-55,55);controls.target.z=clamp(controls.target.z,-55,55);controls.target.y=clamp(controls.target.y,-40,4);
    controls.update();updateLight(dt);for(const f of anim)f(t,reduced?0:dt);if(!reduced)for(const m of mixers)m.update(dt);
    fallMats.forEach(m=>m.uniforms.t.value=t);
    renderer.render(scene,camera);placeLabels();
    if(!fpsDone&&!loadingEl.hidden===false){fpsN++;fpsT+=dt;if(fpsT>6){fpsDone=true;const fps=fpsN/fpsT;if(fps<28){ANTS.forEach((a,i)=>{if(i%2){a.m.visible=false;a.mixer.stopAllAction()}})}}}
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- UI ---------- */
const skinsEl=document.getElementById('skins');
function renderSkins(){skinsEl.innerHTML=Object.entries(SEASONS).map(([k,v])=>`<button type="button" id="skin-${k}" data-k="${k}" aria-pressed="${k===season}">${v.nome}</button>`).join('')}
skinsEl.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.k===season||!BASEMAT)return;season=b.dataset.k;try{localStorage.setItem('regno-stagione',season)}catch(_){}renderSkins();build()});
const notteBtn=document.getElementById('notte');
notteBtn.addEventListener('click',()=>{night=!night;notteBtn.setAttribute('aria-pressed',night);notteBtn.textContent=night?'Giorno':'Notte';applyLight(false)});
const dock=document.getElementById('dock');
function renderDock(){dock.innerHTML=AGENTI.map(a=>`<button class="chip" type="button" id="chip-${a.id}" data-id="${a.id}" aria-pressed="${a.id===sel}"><i class="dot" style="background:${STATI[a.stato].c}"></i>${esc(a.nome)}<small>${STATI[a.stato].label}</small></button>`).join('')}
dock.addEventListener('click',e=>{const b=e.target.closest('button');if(b)select(b.dataset.id)});
document.getElementById('fit').addEventListener('click',()=>{close();fit()});
document.getElementById('sire').addEventListener('click',cheer);
const panel=document.getElementById('panel');
function reportJSON(a){const r=a.report;return JSON.stringify({agente:a.id,stato:a.stato,...(a.avanzamento!=null?{avanzamento:a.avanzamento}:{}),aggiornato:r.aggiornato,kpi:Object.fromEntries(r.kpi),attivita:r.attivita.map(([ora,testo])=>({ora,testo})),blocchi:r.blocchi},null,2)}
function renderPanel(a){
  const r=a.report,st=STATI[a.stato];const needs=a.castello?AGENTI.flatMap(x=>x.report.blocchi.map(b=>({...b,da:x.nome}))):r.blocchi;
  panel.innerHTML=`<div class="ph"><span class="eyebrow">${esc(a.tipo)}</span><button class="close" type="button" id="close" aria-label="Chiudi report">×</button>
    <h2>${esc(a.nome)}</h2><p>${esc(a.ruolo)}</p><span class="pill" style="color:${st.c}"><i class="dot" style="background:${st.c}"></i>${st.label}</span></div>
  ${a.stato==='cantiere'?`<section><h3>Costruzione</h3><div class="bar" role="progressbar" aria-valuenow="${a.avanzamento}" aria-valuemin="0" aria-valuemax="100"><i style="width:${a.avanzamento}%"></i></div></section>`:''}
  <div class="kpis">${r.kpi.map(([l,v])=>`<div class="kpi"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('')}</div>
  ${needs.length?`<section class="need"><h3>Serve da te</h3><ol>${needs.map(b=>`<li>${esc(b.cosa)}${b.da?` <em>(${esc(b.da)})</em>`:''}<span>${esc(b.come)}</span></li>`).join('')}</ol></section>`:''}
  ${a.castello?`<section><h3>Villaggi</h3><ul class="agents">${AGENTI.filter(x=>!x.castello).map(x=>`<li><button type="button" data-go="${x.id}"><i class="dot" style="background:${STATI[x.stato].c}"></i>${esc(x.nome)}<small>${STATI[x.stato].label}</small></button></li>`).join('')}</ul></section>`:''}
  <section><h3>Attività recente</h3><ul class="log">${r.attivita.map(([o,tx])=>`<li><time>${esc(o)}</time><span>${esc(tx)}</span></li>`).join('')}</ul></section>
  <details><summary>Report in formato dati</summary><pre>${esc(reportJSON(a))}</pre></details>
  <p class="foot">Fonte: ${esc(r.fonte)} · aggiornato ${esc(r.aggiornato)} · [PROVA] · Modelli 3D: KayKit di Kay Lousberg (CC0)</p>`;
  panel.querySelector('#close').addEventListener('click',close);
  panel.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.go)));
}
function select(id){const a=byId[id];if(!a.anchor)return;sel=id;renderPanel(a);panel.hidden=false;panel.scrollTop=0;renderDock();renderLabels();applyView();
  const[cx,cz]=tw(a.gx,a.gy);flyTo(new THREE.Vector3(cx,1,cz),(a.castello?40:30)*(isMobile()?1.45:1))}
function close(){sel=null;panel.hidden=true;renderDock();renderLabels();applyView()}
addEventListener('keydown',e=>{if(e.key==='Escape'&&sel)close()});
anim.push(()=>{});
const ringAnim=t=>{for(const id in rings){const{rr,rs,rad}=rings[id];if(rr.visible){const p=(t*.6)%1;rr.scale.setScalar((rad+.6)*(1+p*.3));rr.material.opacity=(1-p)*.85}rs.visible=id===sel;if(rs.visible)rs.material.opacity=.55+.4*Math.sin(t*3)}};
const _build=build;build=function(){_build();anim.push(ringAnim)};
renderSkins();renderDock();applyView();
})();
</script>

</html>
