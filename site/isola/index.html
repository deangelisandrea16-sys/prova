<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3c190f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Isola Sire">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/icona-180.png">
<title>Isola di Sire</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: isola isometrica a tutto schermo; HUD in legno e oro in alto e in basso, comandi di rotazione a destra */
:root{
  --wood:#2b1510; --wood-2:#4a2116; --wood-3:#6b2d1c;
  --gold:#e8b85c; --gold-dim:#a07636;
  --ink:#f8eed6; --ink-dim:#d6c39e;
  --ok:#5fbf4a; --warn:#e8b13a; --bad:#e2513a; --rest:#9aa3ad;
  --glass:rgba(24,13,9,.82);
  --sea-1:#bfe3f7; --sea-2:#7cbde6; --sea-3:#3f86c4;
  --font-display:"Cinzel","Trajan Pro",Georgia,serif;
  --font-ui:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{margin:0;background:linear-gradient(180deg,var(--sea-3) 0%,var(--sea-2) 45%,var(--sea-1) 100%);color:var(--ink);font-family:var(--font-ui);-webkit-tap-highlight-color:transparent}
canvas#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:0;outline:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hud{position:fixed;z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}

#veil{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(circle at 50% 40%,#4a2116,#1a0d08);text-align:center;padding:24px}
#veil b{font:700 20px var(--font-display);color:var(--gold);letter-spacing:.06em}
#veil .bar{width:min(240px,70vw);height:6px;border-radius:3px;background:#3b1d12;overflow:hidden}
#veil .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-dim),var(--gold));transition:width .2s}
#veil small{color:var(--ink-dim);font-size:13px}

/* top */
#top{top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
.bar-top{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,var(--wood-3),var(--wood));border:2px solid var(--gold-dim);border-radius:12px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.crest{position:relative;flex:none;padding:0;cursor:pointer;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8f3b24,#3a120b);border:2px solid var(--gold);display:grid;place-items:center;font:700 21px var(--font-display);color:var(--gold)}
.crest .lv{position:absolute;right:-7px;top:-7px;width:21px;height:23px;background:var(--wood-2);border:1.5px solid var(--gold);clip-path:polygon(50% 100%,0 75%,0 0,100% 0,100% 75%);font:800 11px/21px var(--font-ui);color:var(--ink);text-align:center}
.realm{flex:1;min-width:0;text-align:center;line-height:1.05}
.realm small{display:block;font:700 11px var(--font-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-dim)}
.realm b{font:700 22px var(--font-display);font-variant-numeric:tabular-nums}
.goal{display:block;height:5px;margin:4px auto 0;max-width:180px;border-radius:3px;background:rgba(0,0,0,.35);overflow:hidden}
.goal i{display:block;height:100%;background:linear-gradient(90deg,#b98a2c,var(--gold));transition:width .6s}
.rules{flex:none;background:linear-gradient(180deg,#3f8a3a,#286025);border:2px solid var(--gold);border-radius:9px;padding:3px 10px;text-align:center;line-height:1}
.rules small{display:block;font:700 10px var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:#e3f2d6}
.rules b{font:700 19px var(--font-display);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid rgba(232,184,92,.45);border-radius:999px;padding:4px 11px 4px 5px;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip svg{width:20px;height:20px;flex:none}
.chip.alert{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.chip.flash{animation:flash .9s}
@keyframes flash{0%{background:rgba(232,184,92,.8)}100%{background:var(--glass)}}

/* rotation pad */
#pad{right:max(10px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 168px);display:grid;grid-template-columns:repeat(2,48px);gap:8px}
.pbtn{width:48px;height:48px;border-radius:12px;background:linear-gradient(180deg,var(--wood-3),var(--wood));border:2px solid var(--gold-dim);display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.35);padding:0}
.pbtn svg{width:26px;height:26px}
.pbtn:active{transform:translateY(1px)}
#compass{grid-column:1/3;width:auto;height:48px;display:flex;align-items:center;justify-content:center;gap:6px;font:700 13px var(--font-display);letter-spacing:.04em}
#compass svg{width:24px;height:24px;transition:transform .5s}

/* map labels */
#labels{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;background:var(--glass);border:1.5px solid var(--gold-dim);border-radius:8px;padding:3px 9px 3px 4px;font:700 13px var(--font-ui);white-space:nowrap;pointer-events:auto;cursor:pointer;will-change:transform;min-height:30px}
.lbl .sh{width:19px;height:21px;flex:none;background:linear-gradient(180deg,#f0c264,#a8741f);clip-path:polygon(50% 100%,0 76%,0 0,100% 0,100% 76%);color:var(--wood);font:800 11px/20px var(--font-ui);text-align:center}
.st{display:inline-flex;align-items:center;gap:4px;font:800 10.5px var(--font-ui);text-transform:uppercase;letter-spacing:.05em;border-radius:5px;padding:1px 6px;color:#16100c}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.7}
.st.lavora{background:var(--ok)} .st.bloccato{background:var(--bad);color:#fff} .st.cantiere{background:var(--warn)} .st.riposo{background:var(--rest)}
.lbl.small{font-size:12px;opacity:.92}
.dot{display:inline-flex;align-items:center;gap:4px;font:800 10.5px var(--font-ui);text-transform:uppercase;letter-spacing:.05em;border-radius:6px;color:#fff}
.dot::before{content:"";width:10px;height:10px;border-radius:50%;border:1.5px solid rgba(0,0,0,.45);background:var(--c)}
.dot.lavora{--c:var(--ok)} .dot.cantiere{--c:var(--warn)} .dot.riposo{--c:var(--rest)}
.dot.bloccato{--c:#fff;background:var(--bad);padding:1px 6px 1px 4px}

/* bottom */
#bottom{left:0;right:0;bottom:0;padding:0 max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
#mission{align-self:flex-start;max-width:calc(100% - 120px);display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#1c2b3d,#2c4560 75%,rgba(44,69,96,.75));border:1.5px solid #a8bfd8;border-radius:6px 22px 22px 6px;padding:7px 14px 7px 9px;font:700 14px var(--font-ui);text-align:left;min-height:40px}
#mission em{font-style:normal;color:#ffd98a;font-variant-numeric:tabular-nums}
#mission .ico{width:22px;height:22px;flex:none}
#ticker{background:rgba(10,20,32,.84);border-radius:8px;padding:5px 9px;font-size:13px;line-height:1.4;min-height:2.8em}
#ticker div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ticker time{color:#ffd98a;font-weight:800;margin-right:6px;font-variant-numeric:tabular-nums}
#ticker .new{animation:slidein .5s}
@keyframes slidein{from{transform:translateY(8px);opacity:0}}
#nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:linear-gradient(180deg,var(--wood-2),var(--wood));border:2px solid var(--gold-dim);border-radius:14px;padding:5px}
#nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;border-radius:9px;font:700 11.5px var(--font-display);letter-spacing:.04em;min-height:48px}
#nav button svg{width:26px;height:26px}
#nav button[aria-pressed="true"]{background:rgba(232,184,92,.2)}

.sheet{background:linear-gradient(180deg,#3a1b12,#1f0f08);border:2px solid var(--gold-dim);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:9px;max-height:50vh;overflow:auto;box-shadow:0 -6px 20px rgba(0,0,0,.35)}
.sheet h2{margin:0;font:700 16px var(--font-display);color:var(--gold);letter-spacing:.04em;text-wrap:balance}
.sheet p{margin:0;font-size:14.5px;color:var(--ink-dim);line-height:1.45;max-width:65ch}
.sheet p b{color:var(--ink)}
.sheet .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
.kpi{background:rgba(0,0,0,.25);border:1px solid rgba(232,184,92,.25);border-radius:8px;padding:6px 8px}
.kpi small{display:block;font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.05em}
.kpi b{font:700 17px var(--font-display);font-variant-numeric:tabular-nums}
.todo{background:rgba(226,81,58,.14);border:1px solid var(--bad);border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.4}
.todo b{color:#ffb4a6}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.act{background:linear-gradient(180deg,#5b2a19,#3c190f);border:1px solid var(--gold-dim);border-radius:9px;padding:8px 9px;text-align:left;font-size:14px;line-height:1.2;min-height:48px}
.act small{display:block;color:var(--ink-dim);font-size:11.5px;margin-top:2px}
.skins{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin:4px 0 10px}.skin-btn[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.list button{width:100%;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.22);border:1px solid rgba(232,184,92,.3);border-radius:9px;padding:8px 10px;text-align:left;min-height:52px}
.list .nm{flex:1;min-width:0}
.list .nm b{display:block;font-size:15px}
.list .nm small{display:block;color:var(--ink-dim);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:14px;color:var(--ink-dim)}
code{font-size:12px;color:#ffd98a}
.err{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:#1d0f0a;z-index:30;font-size:16px}
/* avvisi e pergamene */
#toast{position:fixed;z-index:12;left:50%;top:calc(env(safe-area-inset-top,0px) + 112px);transform:translateX(-50%);width:max-content;max-width:min(92vw,520px);background:rgba(25,14,8,.94);border:1.5px solid var(--gold);border-radius:12px;padding:10px 14px;font:700 14.5px/1.4 var(--font-ui);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#toast.show{animation:tin .35s ease}
@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}}
#overlay{position:fixed;inset:0;z-index:15;display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));background:rgba(10,6,3,.55)}
.pergamena{width:min(420px,100%);display:grid;grid-template-rows:auto 1fr auto}
.rotolo{height:26px;border-radius:13px;background:linear-gradient(#a7835a,#e7cfa3 45%,#8b6a44);box-shadow:0 4px 10px rgba(0,0,0,.4)}
.carta{background:linear-gradient(90deg,#e9d6ad,#f6ead0 20%,#f6ead0 80%,#e2cc9f);color:#3b2614;margin:-6px 10px;padding:0 22px;max-height:0;overflow:hidden;transition:max-height .7s ease,padding .7s ease;text-align:center;font-family:Georgia,serif}
.aperto .carta{max-height:640px;padding:22px}
.carta .intest{font:700 21px var(--font-display);letter-spacing:.06em;margin:0 0 10px;color:#7a1f1f}
.carta .testo{font-size:17px;margin:0 0 8px}
.carta .nota,.carta .da{font-size:14px;opacity:.8;margin:0 0 8px}
.carta img{display:block;width:100%;border:6px solid #3b2614;border-radius:4px;margin:0 0 8px}
.sigillo{width:78px;height:78px;border-radius:50%;border:0;margin:10px auto 4px;display:grid;place-items:center;font:700 28px var(--font-display);color:#f3c6c0;background:radial-gradient(circle at 35% 30%,#d6453c,#8e1b16 70%);box-shadow:0 3px 0 #5e0f0c,0 6px 12px rgba(0,0,0,.35);cursor:pointer}
.sigillo.timbrato{animation:timbro .5s ease forwards}
@keyframes timbro{40%{transform:scale(1.25)}100%{transform:scale(.9);filter:saturate(.7)}}
.sigillo.piccolo{width:48px;height:48px;font-size:19px;margin:0;flex:none}
.annulla{background:none;border:0;color:#7a5a3a;text-decoration:underline;cursor:pointer;font:500 14px var(--font-ui);min-height:40px}
.carta-form{display:flex;gap:8px;align-items:center;justify-content:center;margin:6px 0 10px}
.carta-form input{flex:1;min-width:0;font:500 15px var(--font-ui);padding:9px 10px;border:1.5px solid #a07636;border-radius:8px;background:#fffaf0;color:#3b2614}
.carta a.dl{display:inline-block;color:#7a1f1f;font:700 14px var(--font-ui);margin:0 0 8px}
@media (prefers-reduced-motion:reduce){.chip.flash,#ticker .new,#toast.show,.sigillo.timbrato{animation:none}.carta{transition:none}#compass svg,.goal i{transition:none}}
@media (min-width:760px){#bottom{left:auto;width:440px}#mission{max-width:100%}}

/* editor della mappa */
#ed-btn{grid-column:1/3;width:auto;display:flex;align-items:center;justify-content:center;gap:6px;font:700 13px var(--font-display);letter-spacing:.04em}
#ed-btn svg{width:22px;height:22px}
#ed-btn[aria-pressed="true"]{border-color:var(--gold);background:linear-gradient(180deg,#8a3a20,#4a1d10)}
body.editing #bottom,body.editing #mission,body.editing .chips{display:none!important}
body.editing .lbl{pointer-events:none}
body.editing #pad{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 84px)}
#editbar{left:0;right:0;bottom:0;padding:0 max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
#ed-tools,#ed-row,#ed-cat{background:linear-gradient(180deg,var(--wood-2),var(--wood));border:2px solid var(--gold-dim);border-radius:14px;padding:5px}
#ed-tools{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
#editbar button{background:none;border:0;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:48px;padding:4px 6px;font:700 11.5px var(--font-display);letter-spacing:.03em}
#editbar button svg{width:24px;height:24px}
#editbar button[aria-pressed="true"]{background:rgba(232,184,92,.22);box-shadow:inset 0 0 0 1.5px var(--gold)}
#editbar button:disabled{opacity:.35;cursor:default}
#ed-row{display:flex;align-items:center;gap:2px;flex-wrap:wrap;justify-content:space-between}
@media (min-width:760px){#ed-info{flex:1 1 200px}}
#ed-info{flex:1 1 100%;padding-top:4px!important;font:600 13.5px var(--font-ui);color:var(--ink-dim);padding:0 6px;min-width:0}
#ed-cat{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
#ed-cat button{flex:none;width:76px}
#ed-cat img{width:56px;height:46px;object-fit:contain}
#ed-more{position:relative}
#ed-more summary{list-style:none;cursor:pointer;min-height:48px;display:flex;align-items:center;padding:0 10px;font:700 12px var(--font-display);border-radius:9px}
#ed-more summary::-webkit-details-marker{display:none}
#ed-more>div{position:absolute;right:0;bottom:calc(100% + 6px);display:flex;flex-direction:column;gap:2px;background:var(--wood);border:2px solid var(--gold-dim);border-radius:10px;padding:5px;min-width:180px}
#ed-more>div button{flex-direction:row;justify-content:flex-start;font:700 13.5px var(--font-ui);padding:6px 10px}
#editbar .fine{background:linear-gradient(180deg,#3f8a3a,#286025);border:1.5px solid var(--gold);padding:4px 16px;font-size:13px}
</style>
</head>
<body>
<div id="veil" role="status"><b>Preparo il regno</b><div class="bar"><i id="veil-bar"></i></div><small id="veil-t">Carico le tessere…</small></div>
<canvas id="world" tabindex="0" aria-label="Mappa isometrica del Regno di Sire. Usa Q ed E per ruotare, le frecce per spostarti, + e − per lo zoom."></canvas>
<div id="labels"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="overlay" hidden></div>

<div class="hud" id="top">
  <div class="bar-top">
    <button class="crest" id="crest" type="button" aria-label="Il Sire parla: ascolta il riassunto del giorno">S<span class="lv">8</span></button>
    <div class="realm"><small>Tesoro del mese</small><b id="tesoro">€ 21.900</b><span class="goal" title="Obiettivo del mese"><i id="goal" style="width:87%"></i></span></div>
    <div class="rules"><small>Regole</small><b id="regole">48</b></div>
  </div>
  <div class="chips" id="chips">
    <span class="chip" id="c-prev"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3h9l3 3v11H4z" fill="#f1e2bf" stroke="#7a5a2a"/><path d="M7 8h6M7 11h6M7 14h4" stroke="#7a5a2a"/></svg><b id="n-prev">4</b> preventivi aperti</span>
    <span class="chip" id="c-udi"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3l7 13H3z" fill="#e8b85c" stroke="#6b4a18"/><path d="M10 9l2.5 7h-5z" fill="#6b4a18"/></svg><b id="n-udi">2</b> approvazioni</span>
    <span class="chip alert" id="c-scad"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 2v16" stroke="#ddd" stroke-width="1.6"/><path d="M5 3h11l-3 3.5 3 3.5H5z" fill="#e2513a"/></svg><b id="n-scad">1</b> fattura scaduta</span>
    <span class="chip" id="c-idee"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 17h16M4 17V9l3-2v10M9 17v-6h3v6M14 17v-9l2 2v7" stroke="#d6c39e" fill="none" stroke-width="1.6"/></svg><b id="n-idee">19</b> idee da costruire</span>
  </div>
</div>

<div class="hud" id="pad" role="group" aria-label="Vista">
  <button class="pbtn" id="rot-l" aria-label="Ruota la vista a sinistra (Q)"><svg viewBox="0 0 26 26" aria-hidden="true"><path d="M8 7a8 8 0 1 1-2.5 7" fill="none" stroke="#e8b85c" stroke-width="2.6" stroke-linecap="round"/><path d="M3 4l5 3-4.6 3.5z" fill="#e8b85c"/></svg></button>
  <button class="pbtn" id="rot-r" aria-label="Ruota la vista a destra (E)"><svg viewBox="0 0 26 26" aria-hidden="true"><path d="M18 7a8 8 0 1 0 2.5 7" fill="none" stroke="#e8b85c" stroke-width="2.6" stroke-linecap="round"/><path d="M23 4l-5 3 4.6 3.5z" fill="#e8b85c"/></svg></button>
  <button class="pbtn" id="zoom-in" aria-label="Avvicina (+)"><svg viewBox="0 0 26 26" aria-hidden="true"><path d="M13 6v14M6 13h14" stroke="#e8b85c" stroke-width="3" stroke-linecap="round"/></svg></button>
  <button class="pbtn" id="zoom-out" aria-label="Allontana (−)"><svg viewBox="0 0 26 26" aria-hidden="true"><path d="M6 13h14" stroke="#e8b85c" stroke-width="3" stroke-linecap="round"/></svg></button>
  <button class="pbtn" id="compass" aria-label="Torna alla vista iniziale"><svg viewBox="0 0 24 24" aria-hidden="true" id="needle"><path d="M12 2l4 10h-8z" fill="#e2513a"/><path d="M12 22l-4-10h8z" fill="#f8eed6"/></svg><span id="dir-lbl">Nord</span></button>
  <button class="pbtn" id="ed-btn" aria-pressed="false" aria-label="Editor della mappa"><svg viewBox="0 0 26 26" aria-hidden="true"><path d="M5 21l1.2-4.6L17 5.6a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L9.6 19.8z" fill="none" stroke="#e8b85c" stroke-width="2.2" stroke-linejoin="round"/><path d="M15 7.6l3.4 3.4" stroke="#e8b85c" stroke-width="2.2"/></svg><span>Editor</span></button>
</div>


<div class="hud" id="editbar" hidden role="toolbar" aria-label="Editor della mappa">
  <div id="ed-tools">
    <button type="button" data-tool="sel" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l12 9-5.5 1L16 20l-2.6 1.2-3-7L6 18z" fill="#e8b85c"/></svg><span>Sposta</span></button>
    <button type="button" data-tool="terra" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.6v8.8L12 21l-8-4.6V7.6z" fill="#5fbf4a" stroke="#e8b85c"/><path d="M12 8v8M8 12h8" stroke="#16100c" stroke-width="2.4"/></svg><span>Terra +</span></button>
    <button type="button" data-tool="scava" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.6v8.8L12 21l-8-4.6V7.6z" fill="none" stroke="#e8b85c" stroke-dasharray="3 2"/><path d="M8 12h8" stroke="#e2513a" stroke-width="2.6"/></svg><span>Terra −</span></button>
    <button type="button" data-tool="strada" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21L11 3M16 21L13 3" stroke="#c99a5b" stroke-width="2.4"/><path d="M12 6v2M12 11v2M12 16v2" stroke="#e8b85c" stroke-width="1.6"/></svg><span>Strada</span></button>
    <button type="button" data-tool="metti" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l3 6H9zM7 10l3 6H4zM17 10l3 6h-6z" fill="#5fbf4a"/><path d="M12 15v6M9 18h6" stroke="#e8b85c" stroke-width="2"/></svg><span>Inserisci</span></button>
  </div>
  <div id="ed-cat" hidden></div>
  <div id="ed-row">
    <span id="ed-info" aria-live="polite"></span>
    <button type="button" id="ed-rot" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a7 7 0 1 0 1.5 6" fill="none" stroke="#e8b85c" stroke-width="2.4" stroke-linecap="round"/><path d="M19 3v5h-5" fill="none" stroke="#e8b85c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Ruota</span></button>
    <button type="button" id="ed-del" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13" fill="none" stroke="#e2513a" stroke-width="2.2" stroke-linejoin="round"/></svg><span>Elimina</span></button>
    <button type="button" id="ed-undo" disabled aria-label="Annulla"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 0 1 0 10h-2" fill="none" stroke="#e8b85c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Annulla</span></button>
    <button type="button" id="ed-redo" disabled aria-label="Ripristina"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7l5 5-5 5M20 12H9a5 5 0 0 0 0 10h2" fill="none" stroke="#e8b85c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Rifai</span></button>
    <details id="ed-more"><summary>Altro</summary><div>
      <button type="button" id="ed-regni">I tuoi regni</button>
      <button type="button" id="ed-exp">Esporta mappa</button>
      <button type="button" id="ed-imp">Importa mappa</button>
      <button type="button" id="ed-orig">Svuota questo regno</button>
      <input type="file" id="ed-file" accept="application/json,.json" hidden>
    </div></details>
    <button type="button" id="ed-fine" class="fine">Fine</button>
  </div>
</div>
<div class="hud" id="bottom">
  <section class="sheet" id="sheet" hidden aria-live="polite"></section>
  <button id="mission" type="button"><svg class="ico" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 3h12l4 4v12H3z" fill="#efe1bd"/><circle cx="15" cy="16" r="4" fill="#b8321f"/><path d="M6 8h8M6 11h6" stroke="#7a5a2a"/></svg><span id="mission-t">Caricamento…</span></button>
  <div id="ticker" aria-live="polite"></div>
  <nav id="nav" aria-label="Menu del regno">
    <button id="n-list" aria-pressed="false"><svg viewBox="0 0 26 26" aria-hidden="true"><path d="M5 6h16M5 13h16M5 20h16" stroke="#e8b85c" stroke-width="2.6" stroke-linecap="round"/></svg>Elenco</button>
    <button id="n-ev" aria-pressed="false"><svg viewBox="0 0 26 26" aria-hidden="true"><path d="M13 3l3 7 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z" fill="#e8b85c" stroke="#6b4a18"/></svg>Eventi</button>
    <button id="n-snd" aria-pressed="false"><svg viewBox="0 0 26 26" aria-hidden="true"><path d="M4 10h5l6-5v16l-6-5H4z" fill="#e8b85c"/><path id="snd-w" d="M18 9a6 6 0 0 1 0 8M20.5 6.5a10 10 0 0 1 0 13" fill="none" stroke="#e8b85c" stroke-width="2" stroke-linecap="round" opacity=".3"/></svg><span id="snd-lbl">Suoni</span></button>
    <button id="n-skin" aria-pressed="false"><svg viewBox="0 0 26 26" aria-hidden="true"><path d="M13 3a10 10 0 1 0 0 20c1.5 0 2-1 2-2s-1-1.5-1-2.5 1-1.5 2-1.5h2.5A4.5 4.5 0 0 0 23 12.5C23 7 18.5 3 13 3z" fill="none" stroke="#e8b85c" stroke-width="2"/><circle cx="8" cy="12" r="1.6" fill="#e8b85c"/><circle cx="11" cy="7.5" r="1.6" fill="#e8b85c"/><circle cx="16.5" cy="8" r="1.6" fill="#e8b85c"/></svg>Skin</button>
    <button id="n-info" aria-pressed="false"><svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="10" fill="none" stroke="#e8b85c" stroke-width="2"/><path d="M13 11v7M13 7v1" stroke="#e8b85c" stroke-width="2.6" stroke-linecap="round"/></svg>Leggenda</button>
  </nav>
</div>
