<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Sciame Nebulare: sparatutto a ondate con combo, bonus e nave misteriosa.">
  <meta name="theme-color" content="#05060f">
  <title>Sciame Nebulare</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2305060f'/%3E%3Cpath d='M16 5 26 25H6z' fill='%2353f3c3'/%3E%3Ccircle cx='16' cy='18' r='3' fill='%23ff4fd8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <div class="stage">
      <canvas id="game" width="480" height="640" aria-label="Area di gioco di Sciame Nebulare"></canvas>
      <div id="overlay" class="overlay" aria-live="polite"></div>
    </div>

    <div class="touch" aria-label="Controlli touch">
      <button type="button" class="pad" data-hold="left" aria-label="Sinistra">&#9664;</button>
      <button type="button" class="pad fire" data-hold="fire" aria-label="Fuoco">FUOCO</button>
      <button type="button" class="pad" data-hold="right" aria-label="Destra">&#9654;</button>
    </div>

    <div class="bar">
      <button type="button" id="btn-pause">Pausa (P)</button>
      <button type="button" id="btn-sound">Audio: sì (M)</button>
    </div>
  </main>

  <script src="scoring.js"></script>
  <script src="game.js"></script>
</body>
</html>
